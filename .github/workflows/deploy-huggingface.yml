# Mirrors this repository to a Hugging Face Docker Space on every push to main.
# Setup (once): create a Docker Space, then add repository secret HF_TOKEN (a
# write token) and repository variable HF_SPACE (e.g. "your-name/velora").
name: Deploy to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      status_only:
        description: "Only report the Space's build stage, health and logs"
        type: boolean
        default: false

concurrency:
  group: deploy-huggingface
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' && !inputs.status_only }}
    steps:
      - uses: actions/checkout@v4

      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          # Push a single-commit snapshot: Spaces reject shallow pushes, and the
          # older history contains binary files that would need Git LFS.
          git checkout --orphan hf-deploy
          # A Space needs its config as front matter at the top of README.md.
          printf -- '---\ntitle: Velora\nemoji: 📈\ncolorFrom: blue\ncolorTo: indigo\nsdk: docker\napp_port: 7860\npinned: false\n---\n\n' | cat - README.md > README.hf.md
          mv README.hf.md README.md
          git add -A
          git -c user.name="deploy-bot" -c user.email="deploy-bot@users.noreply.github.com" commit -qm "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main

  status:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' && inputs.status_only }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Runtime
        run: |
          curl -sS -H "Authorization: Bearer $HF_TOKEN" "https://huggingface.co/api/spaces/$HF_SPACE/runtime" | jq .
      - name: Health
        run: |
          host="$(echo "$HF_SPACE" | tr '/_.' '---' | tr 'A-Z' 'a-z').hf.space"
          curl -sS -m 30 "https://$host/api/health" || true
      - name: Logs
        run: |
          for kind in build run; do
            echo "===== $kind logs (tail) ====="
            timeout 25 curl -sS -N -H "Authorization: Bearer $HF_TOKEN" \
              "https://huggingface.co/api/spaces/$HF_SPACE/logs/$kind" \
              | sed -n 's/^data: //p' | jq -r '.data // empty' 2>/dev/null | tail -n 60 || true
          done
