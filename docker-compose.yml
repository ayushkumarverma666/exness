# Local production-like stack: Postgres + the all-in-one app image.
#   docker compose up --build   ->  http://localhost:7860
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: trading
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "7860:7860"
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/trading
      JWT_SECRET: local-development-secret-change-me-please-0123456789
      COOKIE_SECURE: "false"
    depends_on:
      - postgres

volumes:
  pgdata:
